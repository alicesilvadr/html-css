<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        div.container {
            background-color: lightcoral;
            height: 100px;
            display: flex;
            flex-flow: column wrap;
        }

        div.item {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            flex: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Teste A</div>
        <div class="item">Teste B</div>
        <div class="item">Teste C</div>
        <div class="item">Teste D</div>
        <div class="item">Teste E</div>
        <div class="item">Teste F</div>
        <div class="item">Teste G</div>

    </div>
</body>
</html>
